<svg xmlns="http://www.w3.org/2000/svg" width="640" height="620" viewBox="0 0 640 620" role="img" aria-label="Pipeline of the Shariah Compliance RAG: question or term sheet, input security gate, router agent, extractor, checker and verifier agents, stratified retrieval over BNM, SAC and AAOIFI, then a cited answer or escalation to a Shariah committee."><style>.fl{stroke-dasharray:4 5;animation:m 1.1s linear infinite}@keyframes m{to{stroke-dashoffset:-18}}@media (prefers-reduced-motion:reduce){.fl{animation:none}}</style><rect x="1" y="1" width="638" height="618" rx="12" fill="#0D1117"/><text x="40" y="62" font-family="Arial, Helvetica, 'Segoe UI', sans-serif" font-size="13" fill="#7D8590" font-weight="700" letter-spacing="1.4">HOW MY RAG ANSWERS</text><text x="40" y="94" font-family="Arial, Helvetica, 'Segoe UI', sans-serif" font-size="26" fill="#E6EDF3" font-weight="700">Shariah Compliance RAG</text><rect x="80" y="124" width="480" height="46" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1.2"/><text x="320" y="152.5" font-family="Arial, Helvetica, 'Segoe UI', sans-serif" font-size="16" fill="#E6EDF3" font-weight="700" text-anchor="middle">Question or term sheet</text><rect x="80" y="196" width="480" height="58" rx="10" fill="#161B22" stroke="#6B5317" stroke-width="1.2"/><text x="320" y="222" font-family="Arial, Helvetica, 'Segoe UI', sans-serif" font-size="16" fill="#E6EDF3" font-weight="700" text-anchor="middle">Input security gate</text><text x="320" y="241" font-family="Arial, Helvetica, 'Segoe UI', sans-serif" font-size="12.5" fill="#7D8590" text-anchor="middle">PII redaction · injection firewall · BiDi strip</text><rect x="80" y="280" width="480" height="46" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1.2"/><text x="320" y="308.5" font-family="Arial, Helvetica, 'Segoe UI', sans-serif" font-size="16" fill="#E6EDF3" font-weight="700" text-anchor="middle">Router agent</text><rect x="80" y="352" width="148" height="46" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1.2"/><text x="154" y="380.5" font-family="Arial, Helvetica, 'Segoe UI', sans-serif" font-size="16" fill="#E6EDF3" font-weight="700" text-anchor="middle">Extractor</text><rect x="246" y="352" width="148" height="46" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1.2"/><text x="320" y="380.5" font-family="Arial, Helvetica, 'Segoe UI', sans-serif" font-size="16" fill="#E6EDF3" font-weight="700" text-anchor="middle">Checker</text><rect x="412" y="352" width="148" height="46" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1.2"/><text x="486" y="380.5" font-family="Arial, Helvetica, 'Segoe UI', sans-serif" font-size="16" fill="#E6EDF3" font-weight="700" text-anchor="middle">Verifier</text><rect x="80" y="424" width="480" height="74" rx="10" fill="#161B22" stroke="#6B5317" stroke-width="1.2"/><text x="320" y="450" font-family="Arial, Helvetica, 'Segoe UI', sans-serif" font-size="16" fill="#E6EDF3" font-weight="700" text-anchor="middle">Stratified retrieval</text><rect x="170" y="466" width="90" height="22" rx="11" fill="#0D1117" stroke="#30363D"/><text x="215" y="481.5" font-family="Arial, Helvetica, 'Segoe UI', sans-serif" font-size="12.5" fill="#F2C14E" font-weight="700" text-anchor="middle">BNM</text><rect x="280" y="466" width="90" height="22" rx="11" fill="#0D1117" stroke="#30363D"/><text x="325" y="481.5" font-family="Arial, Helvetica, 'Segoe UI', sans-serif" font-size="12.5" fill="#F2C14E" font-weight="700" text-anchor="middle">SAC</text><rect x="390" y="466" width="90" height="22" rx="11" fill="#0D1117" stroke="#30363D"/><text x="435" y="481.5" font-family="Arial, Helvetica, 'Segoe UI', sans-serif" font-size="12.5" fill="#F2C14E" font-weight="700" text-anchor="middle">AAOIFI</text><rect x="80" y="524" width="232" height="46" rx="10" fill="#2A2310" stroke="#F2C14E" stroke-width="1.2"/><text x="196" y="552.5" font-family="Arial, Helvetica, 'Segoe UI', sans-serif" font-size="16" fill="#F2C14E" font-weight="700" text-anchor="middle">Cited answer</text><rect x="328" y="524" width="232" height="46" rx="10" fill="#0E2A28" stroke="#3DD6C6" stroke-width="1.2"/><text x="444" y="552.5" font-family="Arial, Helvetica, 'Segoe UI', sans-serif" font-size="16" fill="#3DD6C6" font-weight="700" text-anchor="middle">Escalate to committee</text><path class="fl" stroke="#F2C14E" stroke-width="2" fill="none" d="M320 170V196"/><path class="fl" stroke="#F2C14E" stroke-width="2" fill="none" d="M320 254V280"/><path class="fl" stroke="#F2C14E" stroke-width="2" fill="none" d="M320 398V424"/><path class="fl" stroke="#F2C14E" stroke-width="2" fill="none" d="M320 326V339H154V352M320 339V352M320 339H486V352"/><path class="fl" stroke="#F2C14E" stroke-width="2" fill="none" d="M320 498V511H196V524M320 511H444V524"/><text x="320" y="600" font-family="Arial, Helvetica, 'Segoe UI', sans-serif" font-size="13.5" fill="#7D8590" text-anchor="middle">Every claim cites a retrieved clause, or the system abstains.</text><rect x="1" y="1" width="638" height="618" rx="12" fill="none" stroke="#30363D" stroke-width="1.5"/></svg>